<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наушники — лендинг</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <h1>SoundShop</h1>
      <nav class="nav">
        <a href="#cards">Товары</a>
        <a href="#cards">Контакты</a>
      </nav>
    </div>
  </header>

  <section class="cards" id="cards">
    <h2>Наши наушники</h2>
    <div class="cards__list">
      <div class="product-card">
        <div class="product-card__image">
          <img src="https://th.bing.com/th/id/OIP.Y6vtHAOiNCAcwMzJfu7GygHaE7?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Наушники Lite">
        </div>
        <div class="product-card__content">
          <h3 class="product-card__title">
            Наушники Lite
          </h3>
          <p class="product-card__price">
            3 990 сом
          </p>
          <button class="product-card__button">
            В корзину
          </button>
        </div>
      </div>
      <div class="product-card">
        <div class="product-card__image">
          <img src="https://tse3.mm.bing.net/th/id/OIP.MaH6H0WlUEir3GQ0q9d1mQAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Наушники Pro">
        </div>
        <div class="product-card__content">
          <h3 class="product-card__title">
            Наушники Pro
          </h3>
          <p class="product-card__price">
            4 990 сом
          </p>
          <button class="product-card__button">
            В корзину
          </button>
        </div>
      </div>
      <div class="product-card">
        <div class="product-card__image">
          <img src="https://tse2.mm.bing.net/th/id/OIP.mWYgYmAmjj6T30pqv3XebQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Наушники Max">
        </div>
        <div class="product-card__content">
          <h3 class="product-card__title">
            Наушники Max
          </h3>
          <p class="product-card__price">
            6 990 сом
          </p>
          <button class="product-card__button">
            В корзину
          </button>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
